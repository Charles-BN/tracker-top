[workspace]
resolver = "3"
members = ["crates/top-core", "crates/top-cli", "crates/top-db", "crates/top-app", "crates/top-web"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
top-core = { path = "crates/top-core" }
top-db = { path = "crates/top-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
