# Builds and tests on Windows, macOS and Linux. Each run uploads the programs
# as a downloadable artifact; pushing a tag such as v0.2.0 also attaches them
# to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: tracker-top-windows-x64
            ext: .exe
          - os: macos-latest
            name: tracker-top-macos-arm64
            ext: ""
          - os: ubuntu-latest
            name: tracker-top-linux-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/release/tracker-top${{ matrix.ext }} target/release/top${{ matrix.ext }} README.md dist/${{ matrix.name }}/
          cp -r testdata dist/${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "${{ matrix.name }}.zip" "${{ matrix.name }}"; else zip -r "${{ matrix.name }}.zip" "${{ matrix.name }}"; fi
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.name }}.zip" --clobber
